<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Faculty Dashboard for ShikshaMitr.">
    <meta name="theme-color" content="#6366F1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Faculty Dashboard - ShikshaMitr</title>
    <link rel="icon" type="image/png" href="images/logo-icon.png">
    <link rel="apple-touch-icon" href="images/logo-icon.png">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js"></script>
    <style>
        .page-header {
            text-align: center;
            padding: 3rem 0 1rem;
        }

        .page-header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .dashboard-container {
            max-width: 650px;
            margin: 0 auto 3rem;
            background: var(--bg-card);
            padding: 2.5rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border-card);
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.5s ease-out;
        }
        
        .dashboard-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--gradient-btn);
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.95rem;
        }
        
        .form-control {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 1px solid var(--border-card);
            border-radius: var(--radius-sm);
            background: var(--bg-glass);
            color: var(--text-primary);
            font-size: 1rem;
            font-family: 'Outfit', sans-serif;
            transition: var(--transition-fast);
        }
        
        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
            background: var(--bg-card);
        }
        
        .dashboard-nav {
            display: flex;
            background: var(--bg-glass);
            padding: 0.5rem;
            border-radius: var(--radius-md);
            margin-bottom: 2rem;
            border: 1px solid var(--border-subtle);
        }
        
        .dashboard-tab {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-weight: 600;
            padding: 0.75rem 1rem;
            cursor: pointer;
            border-radius: var(--radius-sm);
            transition: var(--transition-fast);
            font-size: 0.95rem;
        }
        
        .dashboard-tab:hover {
            color: var(--text-primary);
        }
        
        .dashboard-tab.active {
            background: var(--bg-card-hover);
            color: var(--primary);
            box-shadow: var(--shadow-card);
        }
        
        .tab-content {
            display: none;
            animation: fadeIn 0.4s ease-out;
        }
        
        .tab-content.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .alert {
            padding: 1rem;
            border-radius: var(--radius-md);
            margin-bottom: 1.5rem;
            display: none;
            font-weight: 500;
            font-size: 0.95rem;
            border: 1px solid;
            animation: fadeIn 0.3s ease-out;
        }
        
        .alert.success {
            background: var(--status-ok-bg);
            color: var(--status-ok-text);
            border-color: var(--status-ok-border);
            display: block;
        }
        
        .alert.error {
            background: var(--status-error-bg);
            color: var(--status-error-text);
            border-color: var(--status-error-border);
            display: block;
        }
        
        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .login-icon {
            font-size: 3rem;
            text-align: center;
            display: block;
            margin-bottom: 1rem;
        }
        
        select.form-control {
            appearance: none;
            background-image: var(--select-arrow);
            background-repeat: no-repeat;
            background-position: right 1rem center;
        }
        select.form-control option {
            background: var(--select-option-bg);
            color: var(--text-primary);
        }
    </style>
</head>
<body>
    <header>
        <div class="container header-container">
            <a href="index.html" class="logo-link">
                <img src="images/logo-icon.png" alt="ShikshaMitr" class="header-logo">
                <span class="logo-text">ShikshaMitr</span>
            </a>
            <div class="header-actions" style="gap: 1rem; display: flex; align-items: center;">
                <button id="logout-btn" class="btn btn-ghost btn-sm" style="display: none;">Logout</button>
                <button id="theme-toggle-btn" class="theme-toggle" aria-label="Toggle theme">🌙</button>
            </div>
        </div>
    </header>

    <main class="container" style="padding-bottom: 100px;">
        
        <div class="page-header" id="page-header">
            <h1>Faculty Portal</h1>
            <p>Upload materials and manage reading exercises.</p>
        </div>

        <!-- Login Section -->
        <section id="login-section" class="dashboard-container" style="max-width: 450px;">
            <span class="login-icon">👨‍🏫</span>
            <h2 class="section-title" style="font-size: 1.5rem;">Welcome Back</h2>
            <p class="section-subtitle">Please sign in to continue.</p>
            
            <div id="login-alert" class="alert error" style="display: none;"></div>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
            </form>
        </section>

        <!-- Dashboard Section -->
        <section id="dashboard-section" class="dashboard-container" style="display: none;">
            <div class="header-actions" style="margin-bottom: 1rem;">
                <h2>Faculty Dashboard</h2>
            </div>
            
            <div class="dashboard-nav">
                <button class="dashboard-tab active" data-target="upload-material">Upload Material</button>
                <button class="dashboard-tab" data-target="upload-reading">Add Reading Lesson</button>
            </div>
            
            <!-- Upload Material Tab -->
            <div id="upload-material" class="tab-content active">
                <div id="material-alert" class="alert"></div>
                
                <form id="material-form">
                    <div class="form-group">
                        <label for="mat-title">Title</label>
                        <input type="text" id="mat-title" class="form-control" placeholder="e.g. Science Chapter 1 Notes" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="mat-type">Material Type</label>
                        <select id="mat-type" class="form-control" required>
                            <option value="notes">Notes</option>
                            <option value="board_paper">Board Paper</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="mat-standard">Standard (Class)</label>
                        <select id="mat-standard" class="form-control" required>
                            <option value="5">Class 5</option>
                            <option value="6">Class 6</option>
                            <option value="7">Class 7</option>
                            <option value="8">Class 8</option>
                            <option value="9">Class 9</option>
                            <option value="10">Class 10</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="mat-subject">Subject</label>
                        <input list="subject-options" id="mat-subject" class="form-control" required placeholder="Select or type subject...">
                        <datalist id="subject-options">
                            <option value="Mathematics">
                            <option value="Science">
                            <option value="English">
                            <option value="Social Studies">
                            <option value="Hindi">
                            <option value="Computer Science">
                        </datalist>
                    </div>
                    
                    <div class="form-group">
                        <label for="mat-file">Upload PDF File</label>
                        <input type="file" id="mat-file" class="form-control" accept=".pdf" required>
                        <small class="text-muted" style="display:block; margin-top:0.5rem;">File will be securely stored in our cloud database.</small>
                    </div>
                    
                    <button type="submit" class="btn btn-primary" id="mat-submit-btn">Upload Material</button>
                </form>
            </div>
            
            <!-- Upload Reading Lesson Tab -->
            <div id="upload-reading" class="tab-content">
                <div id="reading-alert" class="alert"></div>
                
                <form id="reading-form">
                    <div class="form-group">
                        <label for="read-level">Difficulty Level</label>
                        <select id="read-level" class="form-control" required>
                            <option value="1">Level 1 (Beginner)</option>
                            <option value="2">Level 2 (Intermediate)</option>
                            <option value="3">Level 3 (Advanced)</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="read-word">Vocabulary Word</label>
                        <input type="text" id="read-word" class="form-control" placeholder="e.g. Enthusiastic" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="read-sentence">Practice Sentence (Include Emojis!)</label>
                        <input type="text" id="read-sentence" class="form-control" placeholder="e.g. The students were enthusiastic! 🎉" required>
                    </div>
                    
                    <button type="submit" class="btn btn-accent">Add Reading Lesson</button>
                </form>
            </div>
        </section>
    </main>

    <!-- Bottom Navigation (Mobile) -->
    <nav class="bottom-nav">
        <a href="index.html" class="bottom-nav-link">
            <span class="bnav-icon">🏠</span>
            Home
        </a>
        <a href="materials.html?type=notes" class="bottom-nav-link">
            <span class="bnav-icon">📚</span>
            Notes
        </a>
        <a href="faculty.html" class="bottom-nav-link active">
            <span class="bnav-icon">👨‍🏫</span>
            Faculty
        </a>
        <a href="reading.html" class="bottom-nav-link">
            <span class="bnav-icon">🔤</span>
            Reading
        </a>
        <button id="bottom-theme-toggle" class="bottom-nav-theme-btn" aria-label="Toggle theme">
            <span class="bnav-icon">🌙</span>
            Theme
        </button>
    </nav>
    
    <script src="js/faculty.js"></script>
</body>
</html>
