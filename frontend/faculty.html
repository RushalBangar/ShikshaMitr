<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Prevent dark mode flash -->
    <script src="js/theme.js"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2N8TR3HLN2"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-2N8TR3HLN2');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Faculty Login - ShikshaMitr">
    <meta name="theme-color" content="#6366F1">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Faculty Login - ShikshaMitr</title>
    <link rel="icon" type="image/png" href="images/logo-icon.png">
    <link rel="apple-touch-icon" href="images/logo-icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background-color: var(--bg-body);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .auth-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .auth-container {
            max-width: 420px;
            width: 100%;
            background: var(--bg-card);
            padding: 2.5rem;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-card);
            animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        /* Gradient accent bar at the top */
        .auth-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--gradient-btn);
        }

        .auth-icon {
            width: 52px;
            height: 52px;
            margin: 0 auto 1.25rem;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-icon svg {
            width: 26px;
            height: 26px;
            stroke: var(--text-primary);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 1.75rem;
        }

        .auth-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.35rem;
            letter-spacing: -0.02em;
        }

        .auth-header p {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        /* Alert */
        .alert {
            padding: 0.75rem 1rem;
            border-radius: var(--radius-sm);
            margin-bottom: 1.25rem;
            display: none;
            font-weight: 500;
            font-size: 0.85rem;
            border: 1px solid;
            text-align: center;
        }

        .alert.success {
            background: var(--status-ok-bg);
            color: var(--status-ok-text);
            border-color: var(--status-ok-border);
            display: block;
        }

        .alert.error {
            background: var(--status-error-bg);
            color: var(--status-error-text);
            border-color: var(--status-error-border);
            display: block;
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 0.85rem;
            color: var(--text-muted);
            font-size: 1.1rem;
            pointer-events: none;
            line-height: 1;
        }

        .form-control {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.75rem;
            border: 1.5px solid var(--border-card);
            border-radius: var(--radius-sm);
            background: transparent;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: 'Outfit', sans-serif;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-glow);
            background: var(--bg-card);
        }

        .form-control::placeholder {
            color: var(--text-muted);
        }

        .password-toggle {
            position: absolute;
            right: 0.85rem;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 2px;
            font-size: 1.1rem;
            line-height: 1;
            transition: color 0.15s ease;
        }

        .password-toggle:hover {
            color: var(--text-primary);
        }

        /* Password row */
        .password-label-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.4rem;
        }

        .forgot-link {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--primary);
            text-decoration: none;
            transition: opacity 0.15s;
        }

        .forgot-link:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        /* Remember me */
        .remember-row {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
            margin-top: -0.25rem;
        }

        .remember-label {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            cursor: pointer;
            user-select: none;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .remember-label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        /* Submit */
        .btn-auth {
            width: 100%;
            padding: 0.85rem;
            background: var(--text-primary);
            color: var(--bg-body);
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.95rem;
            font-family: 'Outfit', sans-serif;
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            margin-top: 0.5rem;
        }

        .btn-auth:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-auth:active {
            transform: scale(0.98);
            transition-duration: 0.08s;
        }

        .btn-auth:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* Restricted note */
        .restricted-note {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Dark mode input focus override */
        [data-theme="dark"] .form-control:focus {
            border-color: #818CF8;
            box-shadow: 0 0 0 4px rgba(129, 140, 248, 0.25);
        }

        /* Mobile tweaks */
        @media (max-width: 480px) {
            .auth-container {
                padding: 1.5rem 1.25rem;
                border-radius: var(--radius-md);
            }
        }
    </style>
</head>
<body>
    <header style="border-bottom: 1px solid var(--border-subtle); background: var(--bg-card);">
        <div class="container header-container" style="padding: 1rem 0;">
            <a href="index.html" class="logo-link">
                <img src="images/logo-icon.png" alt="ShikshaMitr" class="header-logo">
                <span class="logo-text">ShikshaMitr</span>
            </a>
            <div style="display: flex; align-items: center; gap: 1rem;">
                <a href="student-login.html" class="btn btn-ghost btn-sm" style="font-size: 0.85rem;">Student Portal</a>
                <button id="theme-toggle-btn" class="theme-toggle" aria-label="Toggle theme" style="background: transparent; border: none; font-size: 1.1rem; cursor: pointer;">🌙</button>
            </div>
        </div>
    </header>

    <main class="container auth-wrapper">
        <div class="auth-container">
            <!-- Faculty Icon -->
            <div class="auth-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
                </svg>
            </div>

            <!-- Header -->
            <div class="auth-header">
                <h1>Faculty Access</h1>
                <p>Sign in to manage curriculum and content.</p>
            </div>

            <!-- Alert -->
            <div id="login-alert" class="alert" style="display: none;"></div>

            <!-- Login Form -->
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input type="text" id="username" class="form-control" placeholder="Enter faculty ID" required autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <div class="password-label-row">
                        <label for="password" style="margin-bottom: 0;">Password</label>
                        <a href="#" class="forgot-link" onclick="alert('Contact administrator to reset your password.'); return false;">Forgot?</a>
                    </div>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="password-toggle" onclick="togglePassword('password', this)" aria-label="Toggle password visibility">👁</button>
                    </div>
                </div>

                <div class="remember-row">
                    <label class="remember-label">
                        <input type="checkbox" checked>
                        <span>Remember this terminal</span>
                    </label>
                </div>

                <button type="submit" class="btn-auth" id="login-submit-btn">Sign in</button>
            </form>

            <p class="restricted-note">Restricted system. Authorized teaching staff and administrators only.</p>
        </div>

    </main>

    <!-- Bottom Navigation (Mobile) -->
    <nav class="bottom-nav">
        <a href="index.html" class="bottom-nav-link">
            <span class="bnav-icon">🏠</span>
            <span>Home</span>
        </a>
        <a href="materials.html" class="bottom-nav-link">
            <span class="bnav-icon">📚</span>
            <span>Study</span>
        </a>
        <a href="quiz.html" class="bottom-nav-link">
            <span class="bnav-icon">🎯</span>
            <span>Quiz</span>
        </a>
        <a href="forum.html" class="bottom-nav-link">
            <span class="bnav-icon">💬</span>
            <span>Forum</span>
        </a>
        <a href="faculty.html" class="bottom-nav-link active">
            <span class="bnav-icon">👤</span>
            <span>Profile</span>
        </a>
    </nav>

    <script>
        // Password visibility toggle
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
            } else {
                input.type = 'password';
                btn.textContent = '👁';
            }
        }
    </script>

    <script src="js/ws-client.js"></script>
    <script src="js/faculty.js"></script>
</body>
</html>
