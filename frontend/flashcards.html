<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Interactive Flashcards - ShikshaMitr</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js"></script>
    <style>
        .flashcard-container { max-width: 800px; margin: 2rem auto; padding: 1rem; text-align: center; }
        .deck-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; margin-top: 2rem; }
        .deck-card { background: var(--bg-card); border-radius: 8px; padding: 1.5rem; border: 1px solid var(--border-color); cursor: pointer; transition: transform 0.2s; box-shadow: var(--shadow-card); }
        .deck-card:hover { transform: translateY(-5px); border-color: var(--primary-color); }
        .flashcard-view { display: none; margin-top: 2rem; perspective: 1000px; }
        .flashcard { width: 100%; max-width: 500px; height: 300px; margin: 0 auto; position: relative; transition: transform 0.6s; transform-style: preserve-3d; cursor: pointer; }
        .flashcard.flipped { transform: rotateY(180deg); }
        .flashcard-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--bg-card); border-radius: 12px; box-shadow: 0 8px 16px var(--shadow-color); border: 2px solid var(--border-color); padding: 2rem; text-align: center; font-size: 1.2rem; }
        .flashcard-back { transform: rotateY(180deg); background: var(--bg-primary); border-color: var(--primary-color); }
        .controls { margin-top: 2rem; display: none; gap: 0.5rem; justify-content: center; }
        .btn-rating { flex: 1; padding: 0.8rem; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; color: white; }
        .rating-1 { background: #EF4444; } .rating-2 { background: #F59E0B; } .rating-3 { background: #10B981; } .rating-4 { background: #3B82F6; } .rating-5 { background: #8B5CF6; }
    </style>
</head>
<body>
    <header>
        <div class="container header-container">
            <a href="index.html" class="logo-link">
                <h1>ShikshaMitr</h1>
            </a>
            <nav class="nav-links">
                <a href="student-dashboard.html">Dashboard</a>
                <a href="materials.html">Materials</a>
                <a href="quiz.html">Quizzes</a>
                <a href="forum.html">Forum</a>
                <a href="flashcards.html" class="active">Flashcards</a>
                <button id="theme-toggle-btn" class="theme-toggle" aria-label="Toggle theme">🌙</button>
            </nav>
        </div>
    </header>

    <main class="container flashcard-container">
        <h2>Interactive Flashcards</h2>
        <p style="color: var(--text-secondary);">Master concepts using Spaced Repetition (SRS).</p>

        <div id="deck-view">
            <h3 style="text-align: left; margin-top: 2rem;">Available Decks</h3>
            <div id="deck-list" class="deck-list">
                <!-- Decks injected by JS -->
            </div>
            
            <!-- Faculty only: create deck form -->
            <div id="faculty-create-deck" style="display: none; margin-top: 3rem; text-align: left; background: var(--bg-card); padding: 1.5rem; border-radius: 8px;">
                <h3>Create New Deck (Faculty Only)</h3>
                <form id="create-deck-form" style="display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem;">
                    <input type="text" id="deck-title" placeholder="Deck Title" required class="form-input">
                    <input type="text" id="deck-subject" placeholder="Subject" required class="form-input">
                    <div id="cards-container" style="display: flex; flex-direction: column; gap: 1rem;">
                        <div class="card-input" style="display: flex; gap: 1rem;">
                            <input type="text" placeholder="Front (Question)" class="form-input" style="flex:1" required>
                            <input type="text" placeholder="Back (Answer)" class="form-input" style="flex:1" required>
                        </div>
                    </div>
                    <button type="button" class="btn btn-secondary" onclick="addCardInput()">+ Add Another Card</button>
                    <button type="submit" class="btn btn-primary" style="align-self: flex-start;">Save Deck</button>
                </form>
            </div>
        </div>

        <div id="study-view" class="flashcard-view">
            <button class="btn btn-secondary" onclick="closeStudyView()" style="margin-bottom: 2rem;">&larr; Back to Decks</button>
            <h3 id="study-deck-title">Deck Title</h3>
            <p id="study-progress">Cards Due: 0</p>
            
            <div class="flashcard" id="flashcard" onclick="flipCard()">
                <div class="flashcard-face flashcard-front" id="card-front">
                    <!-- Front content -->
                </div>
                <div class="flashcard-face flashcard-back" id="card-back">
                    <!-- Back content -->
                </div>
            </div>

            <div class="controls" id="study-controls">
                <button class="btn-rating rating-1" onclick="submitRating(1)">1 - Again</button>
                <button class="btn-rating rating-2" onclick="submitRating(2)">2 - Hard</button>
                <button class="btn-rating rating-3" onclick="submitRating(3)">3 - Good</button>
                <button class="btn-rating rating-4" onclick="submitRating(4)">4 - Easy</button>
                <button class="btn-rating rating-5" onclick="submitRating(5)">5 - Perfect</button>
            </div>
            <p id="flip-hint" style="margin-top: 1rem; color: var(--text-secondary);">Click the card to flip!</p>
        </div>
    </main>

    <!-- Bottom Navigation (Mobile) -->
    <nav class="bottom-nav">
        <a href="index.html" class="bottom-nav-link">
            <span class="bnav-icon">🏠</span>
            Home
        </a>
        <a href="student-dashboard.html" class="bottom-nav-link">
            <span class="bnav-icon">🎓</span>
            Dashboard
        </a>
        <a href="flashcards.html" class="bottom-nav-link active">
            <span class="bnav-icon">🧠</span>
            Flashcards
        </a>
        <a href="forum.html" class="bottom-nav-link">
            <span class="bnav-icon">💬</span>
            Forum
        </a>
        <button id="bottom-theme-toggle" class="bottom-nav-theme-btn" aria-label="Toggle theme">
            <span class="bnav-icon">🌙</span>
            Theme
        </button>
    </nav>

    <script src="js/app.js"></script>
    <script src="js/flashcards.js"></script>
</body>
</html>
