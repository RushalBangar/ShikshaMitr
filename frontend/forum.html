<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Peer-to-Peer Forums - ShikshaMitr</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js"></script>
    <style>
        .forum-container { max-width: 800px; margin: 2rem auto; padding: 1rem; }
        .post-card { background: var(--bg-card); border-radius: 8px; padding: 1.5rem; margin-bottom: 1rem; box-shadow: 0 4px 6px var(--shadow-color); border: 1px solid var(--border-color); }
        .post-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .post-title { font-size: 1.25rem; font-weight: bold; color: var(--text-primary); cursor: pointer; }
        .post-meta { font-size: 0.85rem; color: var(--text-secondary); }
        .badge { background: var(--primary-color); color: white; padding: 0.2rem 0.5rem; border-radius: 12px; font-size: 0.8rem; }
        .reply-section { margin-top: 1rem; border-top: 1px solid var(--border-color); padding-top: 1rem; display: none; }
        .reply-card { background: var(--bg-primary); padding: 1rem; border-radius: 6px; margin-bottom: 0.5rem; border-left: 4px solid var(--text-secondary); }
        .reply-card.verified { border-left-color: #10B981; background: rgba(16, 185, 129, 0.05); }
        .verified-badge { color: #10B981; font-weight: bold; font-size: 0.8rem; margin-left: 0.5rem; }
        .btn-verify { background: #10B981; color: white; border: none; padding: 0.4rem 0.8rem; border-radius: 4px; cursor: pointer; font-size: 0.8rem; margin-top: 0.5rem; }
        .reply-input-group { display: flex; gap: 0.5rem; margin-top: 1rem; }
        .reply-input { flex-grow: 1; padding: 0.8rem; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary); }
    </style>
</head>
<body>
    <header>
        <div class="container header-container">
            <a href="index.html" class="logo-link">
                <h1>ShikshaMitr</h1>
            </a>
            <nav class="nav-links">
                <a href="student-dashboard.html">Dashboard</a>
                <a href="materials.html">Materials</a>
                <a href="quiz.html">Quizzes</a>
                <a href="forum.html" class="active">Forum</a>
                <a href="flashcards.html">Flashcards</a>
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">🌙</button>
            </nav>
        </div>
    </header>

    <main class="container forum-container">
        <h2>Peer-to-Peer Doubt Forums</h2>
        <p style="color: var(--text-secondary); margin-bottom: 2rem;">Ask questions, help peers, and earn Community Points!</p>
        
        <div class="card" style="margin-bottom: 2rem; padding: 1.5rem;">
            <h3>Ask a Question</h3>
            <form id="new-post-form" style="display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem;">
                <input type="text" id="post-title" placeholder="Question Title" required class="form-input">
                <select id="post-subject" required class="form-input">
                    <option value="" disabled selected>Select Subject</option>
                    <option value="Mathematics">Mathematics</option>
                    <option value="Science">Science</option>
                    <option value="English">English</option>
                </select>
                <textarea id="post-content" placeholder="Describe your doubt..." rows="4" required class="form-input"></textarea>
                <button type="submit" class="btn btn-primary" style="align-self: flex-start;">Post Question</button>
            </form>
        </div>

        <div id="posts-list">
            <!-- Posts injected by JS -->
        </div>
    </main>

    <script src="js/app.js"></script>
    <script src="js/forum.js"></script>
</body>
</html>
