<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Browse study materials, board papers, and notes on ShikshaMitr.">
    <meta name="theme-color" content="#6366F1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Materials - ShikshaMitr</title>
    <link rel="icon" type="image/png" href="images/logo-icon.png">
    <link rel="apple-touch-icon" href="images/logo-icon.png">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js"></script>
</head>
<body>
    <header>
        <div class="container header-container">
            <a href="index.html" class="logo-link">
                <img src="images/logo-icon.png" alt="ShikshaMitr" class="header-logo">
                <span class="logo-text">ShikshaMitr</span>
            </a>
            <nav class="nav-links">
                <a href="materials.html?type=notes" class="nav-link active">
                    <span class="nav-icon">📚</span>
                    <span>Notes</span>
                </a>
                <a href="materials.html?type=board_paper" class="nav-link">
                    <span class="nav-icon">📝</span>
                    <span>Papers</span>
                </a>
                <a href="reading.html" class="nav-link">
                    <span class="nav-icon">🔤</span>
                    <span>Reading</span>
                </a>
                <button id="theme-toggle-btn" class="theme-toggle" aria-label="Toggle theme">🌙</button>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="page-header">
            <a href="index.html" class="back-link">← Back to Home</a>
            <h1 id="page-title">📚 Study Materials</h1>
            <p>Find notes, papers, and study resources.</p>
            <div class="filters">
                <select id="standard-filter" class="filter-select">
                    <option value="">All Standards</option>
                    <option value="5">5th Standard</option>
                    <option value="6">6th Standard</option>
                    <option value="7">7th Standard</option>
                    <option value="8">8th Standard</option>
                    <option value="9">9th Standard</option>
                    <option value="10">10th Standard</option>
                </select>
                <select id="subject-filter" class="filter-select">
                    <option value="">All Subjects</option>
                    <option value="Math">Math</option>
                    <option value="Science">Science</option>
                    <option value="English">English</option>
                    <option value="History">History</option>
                </select>
            </div>
        </section>

        <section id="materials-list" class="materials-list">
            <div class="skeleton"></div>
            <div class="skeleton"></div>
            <div class="skeleton"></div>
            <div class="skeleton"></div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 ShikshaMitr. Built with ❤️ for students.</p>
        </div>
    </footer>

    <script src="js/materials.js"></script>

    <!-- Bottom Navigation (Mobile) -->
    <nav class="bottom-nav">
        <a href="index.html" class="bottom-nav-link">
            <span class="bnav-icon">🏠</span>
            Home
        </a>
        <a href="materials.html?type=notes" class="bottom-nav-link active">
            <span class="bnav-icon">📚</span>
            Notes
        </a>
        <a href="materials.html?type=board_paper" class="bottom-nav-link">
            <span class="bnav-icon">📝</span>
            Papers
        </a>
        <a href="reading.html" class="bottom-nav-link">
            <span class="bnav-icon">🔤</span>
            Reading
        </a>
        <button id="bottom-theme-toggle" class="bottom-nav-theme-btn" aria-label="Toggle theme">
            <span class="bnav-icon">🌙</span>
            Theme
        </button>
    </nav>
</body>
</html>
