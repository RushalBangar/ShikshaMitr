<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Student Login & Registration - ShikshaMitr">
    <meta name="theme-color" content="#6366F1">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Student Portal - ShikshaMitr</title>
    <link rel="icon" type="image/png" href="images/logo-icon.png">
    <link rel="apple-touch-icon" href="images/logo-icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js"></script>
    <style>
        /* Ambient Background */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: -1;
            pointer-events: none;
        }

        .ambient-blob {
            position: absolute;
            filter: blur(100px);
            opacity: 0.2;
            border-radius: 50%;
            animation: float 25s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }

        .ambient-blob.primary {
            background: var(--primary);
            width: 45vw;
            height: 45vw;
            top: -15vw;
            right: -10vw;
        }

        .ambient-blob.accent {
            background: var(--accent);
            width: 35vw;
            height: 35vw;
            bottom: -10vw;
            left: -10vw;
            animation-delay: -8s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(-20px, 40px) scale(1.05); }
            66% { transform: translate(30px, -20px) scale(0.95); }
            100% { transform: translate(-10px, 20px) scale(1.02); }
        }

        .auth-container {
            max-width: 440px;
            margin: 2rem auto 5rem;
            background: var(--bg-glass);
            backdrop-filter: blur(24px) saturate(1.5);
            -webkit-backdrop-filter: blur(24px) saturate(1.5);
            padding: 2.5rem;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-card-hover);
            border: 1px solid var(--border-card);
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1;
        }

        .auth-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--gradient-btn);
        }

        .auth-nav {
            display: flex;
            background: var(--bg-surface);
            padding: 0.35rem;
            border-radius: var(--radius-md);
            margin-bottom: 1.75rem;
            border: 1px solid var(--border-subtle);
        }

        .auth-tab {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-weight: 600;
            padding: 0.7rem 1rem;
            cursor: pointer;
            border-radius: var(--radius-sm);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            font-size: 0.95rem;
            font-family: 'Outfit', sans-serif;
            text-align: center;
        }

        .auth-tab:active {
            transform: scale(0.96);
        }

        .auth-tab.active {
            background: var(--bg-card);
            color: var(--primary);
            box-shadow: var(--shadow-card);
            transform: scale(1);
        }

        .form-group {
            margin-bottom: 1.25rem;
            animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .form-group:nth-child(1) { animation-delay: 0.05s; }
        .form-group:nth-child(2) { animation-delay: 0.1s; }
        .form-group:nth-child(3) { animation-delay: 0.15s; }
        .form-group:nth-child(4) { animation-delay: 0.2s; }

        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        .form-control {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 1.5px solid var(--border-card);
            border-radius: var(--radius-sm);
            background: var(--bg-glass);
            color: var(--text-primary);
            font-size: 1rem;
            font-family: 'Outfit', sans-serif;
            transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-glow);
            background: var(--bg-card);
            transform: scale(1.01);
        }

        .alert {
            padding: 0.9rem 1.2rem;
            border-radius: var(--radius-md);
            margin-bottom: 1.5rem;
            display: none;
            font-weight: 500;
            font-size: 0.9rem;
            border: 1px solid;
            animation: fadeInUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .alert.success {
            background: var(--status-ok-bg);
            color: var(--status-ok-text);
            border-color: var(--status-ok-border);
            display: block;
        }

        .alert.error {
            background: var(--status-error-bg);
            color: var(--status-error-text);
            border-color: var(--status-error-border);
            display: block;
        }

        /* Google Sign-In Divider */
        .divider-or {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1.5rem 0;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 500;
        }

        .divider-or::before,
        .divider-or::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-subtle);
        }
    </style>
</head>
<body>
    <div class="ambient-bg">
        <div class="ambient-blob primary"></div>
        <div class="ambient-blob accent"></div>
    </div>
    <header>
        <div class="container header-container">
            <a href="index.html" class="logo-link">
                <img src="images/logo-icon.png" alt="ShikshaMitr" class="header-logo">
                <span class="logo-text">ShikshaMitr</span>
            </a>
            <div style="display: flex; align-items: center; gap: 0.8rem;">
                <a href="faculty.html" class="btn btn-ghost btn-sm" style="display: flex; gap: 0.3rem;"><span class="nav-icon">👨‍🏫</span> Faculty</a>
                <button id="theme-toggle-btn" class="theme-toggle" aria-label="Toggle theme">🌙</button>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="page-header" style="text-align: center; padding: 2.5rem 0 1rem;">
            <h1>🎓 Student Portal</h1>
            <p>Sign in or register to track your learning journey, earn badges, and practice.</p>
        </div>

        <div class="auth-container">
            <div class="auth-nav">
                <button class="auth-tab active" id="tab-login-btn">Sign In</button>
                <button class="auth-tab" id="tab-register-btn">Register</button>
            </div>

            <div id="auth-alert" class="alert"></div>

            <!-- Login Form -->
            <form id="student-login-form">
                <div class="form-group">
                    <label for="login-username">Username or Email</label>
                    <input type="text" id="login-username" class="form-control" placeholder="e.g. rahul123" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary" id="login-submit-btn" style="width: 100%; margin-top: 0.5rem;">
                    Sign In to Learning 🚀
                </button>
                
                <div class="divider-or">or</div>
                
                <!-- Google Sign-In Container -->
                <div id="g_id_onload"
                     data-client_id="YOUR_GOOGLE_CLIENT_ID_HERE"
                     data-context="signin"
                     data-ux_mode="popup"
                     data-callback="handleGoogleLogin"
                     data-auto_prompt="false">
                </div>
    
                <div class="g_id_signin"
                     data-type="standard"
                     data-shape="rectangular"
                     data-theme="outline"
                     data-text="signin_with"
                     data-size="large"
                     data-logo_alignment="left" style="margin-top: 1rem; display: flex; justify-content: center;">
                </div>
            </form>

            <!-- Register Form -->
            <form id="student-register-form" style="display: none;">
                <div class="form-group">
                    <label for="reg-fullname">Full Name</label>
                    <input type="text" id="reg-fullname" class="form-control" placeholder="e.g. Rahul Sharma" required>
                </div>
                <div class="form-group">
                    <label for="reg-username">Choose a Username</label>
                    <input type="text" id="reg-username" class="form-control" placeholder="e.g. rahul_learner" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="reg-email">Email Address (Optional)</label>
                    <input type="email" id="reg-email" class="form-control" placeholder="e.g. rahul@gmail.com" autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="reg-password">Create Password</label>
                    <input type="password" id="reg-password" class="form-control" placeholder="Minimum 6 characters" minlength="6" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-accent" id="reg-submit-btn" style="width: 100%; margin-top: 0.5rem;">
                    Create Free Account ✨
                </button>
            </form>
        </div>
    </main>

    <!-- Bottom Navigation (Mobile) -->
    <nav class="bottom-nav">
        <a href="index.html" class="bottom-nav-link">
            <span class="bnav-icon">🏠</span>
            Home
        </a>
        <a href="materials.html?type=notes" class="bottom-nav-link">
            <span class="bnav-icon">📚</span>
            Notes
        </a>
        <a href="student-login.html" class="bottom-nav-link active">
            <span class="bnav-icon">🎓</span>
            Student
        </a>
        <a href="reading.html" class="bottom-nav-link">
            <span class="bnav-icon">🔤</span>
            Reading
        </a>
        <button id="bottom-theme-toggle" class="bottom-nav-theme-btn" aria-label="Toggle theme">
            <span class="bnav-icon">🌙</span>
            Theme
        </button>
    </nav>

    <script src="js/ws-client.js"></script>
    <script src="js/student.js"></script>
</body>
</html>
