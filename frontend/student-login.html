<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Student Login & Registration - ShikshaMitr">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Sign In - ShikshaMitr</title>
    <link rel="icon" type="image/png" href="images/logo-icon.png">
    <link rel="apple-touch-icon" href="images/logo-icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js"></script>
    <style>
        body {
            background-color: var(--bg-body);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        .auth-container {
            max-width: 400px;
            width: 100%;
            margin: 4rem auto;
            background: var(--bg-card);
            padding: 2.5rem;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-subtle);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.15);
            animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .auth-nav {
            display: flex;
            background: var(--bg-surface);
            padding: 4px;
            border-radius: 9999px; /* Pill shape */
            margin-bottom: 2rem;
            border: 1px solid var(--border-subtle);
        }

        .auth-tab {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-weight: 500;
            padding: 0.6rem 1rem;
            cursor: pointer;
            border-radius: 9999px;
            transition: all 0.2s ease;
            font-size: 0.9rem;
            font-family: 'Outfit', sans-serif;
            text-align: center;
        }

        .auth-tab.active {
            background: var(--bg-card);
            color: var(--text-primary);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid var(--border-subtle);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-card);
            border-radius: var(--radius-sm);
            background: transparent;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: 'Outfit', sans-serif;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--text-primary);
            box-shadow: 0 0 0 1px var(--text-primary);
        }

        .btn-auth {
            width: 100%;
            padding: 0.85rem;
            background: var(--text-primary);
            color: var(--bg-body);
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: opacity 0.2s ease;
            margin-top: 0.5rem;
        }

        .btn-auth:hover {
            opacity: 0.9;
        }

        .alert {
            padding: 0.75rem 1rem;
            border-radius: var(--radius-sm);
            margin-bottom: 1.5rem;
            display: none;
            font-weight: 500;
            font-size: 0.85rem;
            border: 1px solid;
            text-align: center;
        }

        .alert.success {
            background: var(--status-ok-bg);
            color: var(--status-ok-text);
            border-color: var(--status-ok-border);
            display: block;
        }

        .alert.error {
            background: var(--status-error-bg);
            color: var(--status-error-text);
            border-color: var(--status-error-border);
            display: block;
        }

        .divider-or {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1.5rem 0;
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .divider-or::before,
        .divider-or::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-card);
        }

        /* Dark mode overrides for extreme high contrast */
        [data-theme="dark"] .form-control:focus {
            border-color: #fff;
            box-shadow: 0 0 0 1px #fff;
        }
        
        .page-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
            text-align: center;
        }

        .page-subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
    <header style="border-bottom: 1px solid var(--border-subtle); background: var(--bg-card);">
        <div class="container header-container" style="padding: 1rem 0;">
            <a href="index.html" class="logo-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-book-open"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                <span class="logo-text" style="font-weight: 600; font-size: 1.1rem; margin-left: 8px;">ShikshaMitr</span>
            </a>
            <div style="display: flex; align-items: center; gap: 1rem;">
                <a href="faculty.html" class="btn btn-ghost btn-sm" style="font-size: 0.85rem;">Faculty Login</a>
                <button id="theme-toggle-btn" class="theme-toggle" aria-label="Toggle theme" style="background: transparent; border: none; font-size: 1.1rem; cursor: pointer;">🌙</button>
            </div>
        </div>
    </header>

    <main class="container" style="flex: 1; display: flex; align-items: center; justify-content: center;">
        <div class="auth-container">
            <h1 class="page-title">Welcome back</h1>
            <p class="page-subtitle">Enter your details to sign in to your account.</p>

            <div class="auth-nav">
                <button class="auth-tab active" id="tab-login-btn">Sign In</button>
                <button class="auth-tab" id="tab-register-btn">Create Account</button>
            </div>

            <div id="auth-alert" class="alert"></div>

            <!-- Login Form -->
            <form id="student-login-form">
                <div class="form-group">
                    <label for="login-username">Username or Email</label>
                    <input type="text" id="login-username" class="form-control" placeholder="e.g. rahul_learner" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-auth" id="login-submit-btn">
                    Sign in
                </button>
                
                <div class="divider-or">or continue with</div>
                
                <!-- Google Sign-In Container -->
                <div id="g_id_onload"
                     data-client_id="439383601384-7iug08uoini9jphqdlg3a0tjefrn6su0.apps.googleusercontent.com"
                     data-context="signin"
                     data-ux_mode="popup"
                     data-callback="handleGoogleLogin"
                     data-auto_prompt="false">
                </div>
    
                <div class="g_id_signin"
                     data-type="standard"
                     data-shape="rectangular"
                     data-theme="outline"
                     data-text="signin_with"
                     data-size="large"
                     data-logo_alignment="center" style="display: flex; justify-content: center;">
                </div>
            </form>

            <!-- Register Form -->
            <form id="student-register-form" style="display: none;">
                <div class="form-group">
                    <label for="reg-fullname">Full Name</label>
                    <input type="text" id="reg-fullname" class="form-control" placeholder="e.g. Rahul Sharma" required>
                </div>
                <div class="form-group">
                    <label for="reg-username">Username</label>
                    <input type="text" id="reg-username" class="form-control" placeholder="e.g. rahul_learner" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="reg-email">Email (Optional)</label>
                    <input type="email" id="reg-email" class="form-control" placeholder="e.g. rahul@gmail.com" autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="reg-password">Password</label>
                    <input type="password" id="reg-password" class="form-control" placeholder="••••••••" minlength="6" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn-auth" id="reg-submit-btn">
                    Sign up
                </button>
            </form>
        </div>
    </main>

    <!-- Bottom Navigation (Mobile) -->
    <nav class="bottom-nav">
        <a href="index.html" class="bottom-nav-link">
            <span class="bnav-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            </span>
            Home
        </a>
        <a href="student-login.html" class="bottom-nav-link active">
            <span class="bnav-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
            Account
        </a>
        <button id="bottom-theme-toggle" class="bottom-nav-theme-btn" aria-label="Toggle theme">
            <span class="bnav-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
            </span>
            Theme
        </button>
    </nav>

    <script src="js/ws-client.js"></script>
    <script src="js/student.js"></script>
</body>
</html>
